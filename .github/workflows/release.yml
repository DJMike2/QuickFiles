name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/release-*'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - 'release/**'
      - 'requirements.txt'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            scanner: fastscan
            archive: QuickFiles-linux-x64.tar.gz
          - os: windows-2022
            scanner: fastscan.exe
            archive: QuickFiles-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 \
            pkg-config libdbus-1-dev libglib2.0-dev libxml2-dev libxtst-dev libxi-dev libx11-dev gettext dbus

      - name: Build native scanner
        run: python -B tools/build_scanner.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build QuickFiles
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name QuickFiles
          --paths .
          --collect-submodules app
          --add-data "app/ui/themes:app/ui/themes"
          --add-data "models/settings.json:models"
          --add-binary "app/core/native/bin/${{ matrix.scanner }}:app/core/native/bin"
          release/launcher.py

      - name: Update bundled Linux accessibility libraries
        if: runner.os == 'Linux'
        run: |
          # Build on Ubuntu 22.04 to keep its runtime baseline with the newer ATK bridge.
          python -m pip install meson==1.5.2 ninja==1.11.1.1
          a11y_source=build/a11y/at-spi2-core-2.52.0
          mkdir -p build/a11y
          curl --fail --location --retry 3 \
            https://download.gnome.org/sources/at-spi2-core/2.52/at-spi2-core-2.52.0.tar.xz \
            -o "$a11y_source.tar.xz"
          echo "0ac3fc8320c8d01fa147c272ba7fa03806389c6b03d3c406d0823e30e35ff5ab  $a11y_source.tar.xz" | sha256sum -c -
          tar -xJf "$a11y_source.tar.xz" -C build/a11y
          meson setup build/a11y/output "$a11y_source" --prefix=/usr --libdir=lib --buildtype=release \
            -Dintrospection=disabled -Dgtk2_atk_adaptor=false -Duse_systemd=false -Dx11=enabled
          meson compile -C build/a11y/output --jobs 2
          meson install -C build/a11y/output --destdir "$PWD/build/a11y/stage"
          for library in libatk-1.0.so.0 libatk-bridge-2.0.so.0 libatspi.so.0; do
            cp -L "build/a11y/stage/usr/lib/$library" "dist/QuickFiles/_internal/$library"
          done
          mkdir -p dist/QuickFiles/third-party/at-spi2-core
          cp "$a11y_source.tar.xz" "$a11y_source/COPYING" dist/QuickFiles/third-party/at-spi2-core/

      - name: Verify packaged scanner
        shell: bash
        run: |
          test -f "dist/QuickFiles/_internal/app/core/native/bin/${{ matrix.scanner }}"

      - name: Include project license
        run: python -c "import shutil; shutil.copy2('LICENSE', 'dist/QuickFiles/LICENSE')"

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "quickfiles.pfx"

          if (-not $env:CERT_BASE64 -or -not $env:CERT_PASSWORD) {
            if ($env:GITHUB_REF_TYPE -eq "tag") {
              throw "Release signing credentials are required for tagged builds"
            }
            Write-Host "Signing credentials unavailable; this test build will be unsigned"
            exit 0
          }

          try {
            [IO.File]::WriteAllBytes(
              $certPath,
              [Convert]::FromBase64String($env:CERT_BASE64)
            )

            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $signtool) {
              throw "SignTool not found"
            }

            & $signtool sign /fd SHA256 `
              /f $certPath `
              /p $env:CERT_PASSWORD `
              "dist/QuickFiles/QuickFiles.exe"

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed"
            }

            $signature = Get-AuthenticodeSignature "dist/QuickFiles/QuickFiles.exe"

            if ($signature.SignerCertificate.Subject -notlike "*CN=QuickFiles Dev*") {
              throw "Unexpected signing certificate"
            }

            Write-Host "QuickFiles signing completed"
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C dist QuickFiles

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/QuickFiles -DestinationPath "${{ matrix.archive }}"

      - name: Verify archive and write checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import subprocess
          import tarfile
          import zipfile

          archive = Path("${{ matrix.archive }}")
          if archive.name.endswith(".tar.gz"):
              subprocess.run(["gzip", "-t", str(archive)], check=True)
              with tarfile.open(archive) as package:
                  executable = package.getmember("QuickFiles/QuickFiles")
                  assert executable.mode & 0o111, "Launcher is not executable"
          else:
              with zipfile.ZipFile(archive) as package:
                  assert package.testzip() is None, "Archive contains a corrupt file"
                  package.getinfo("QuickFiles/QuickFiles.exe")
          with archive.open("rb") as stream:
              checksum = hashlib.file_digest(stream, "sha256").hexdigest()
          archive.with_name(archive.name + ".sha256").write_text(
              f"{checksum}  {archive.name}\n", encoding="utf-8"
          )

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archive: QuickFiles-linux-x64.tar.gz
          - os: ubuntu-24.04
            archive: QuickFiles-linux-x64.tar.gz
          - os: windows-2022
            archive: QuickFiles-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 poppler-utils

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.archive }}

      - name: Verify checksum and extract
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import tarfile
          import zipfile

          archive = Path("${{ matrix.archive }}")
          expected = archive.with_name(archive.name + ".sha256").read_text().split()[0]
          with archive.open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == expected
          if archive.name.endswith(".tar.gz"):
              with tarfile.open(archive) as package:
                  package.extractall(filter="data")
          else:
              with zipfile.ZipFile(archive) as package:
                  package.extractall()

      - name: Install pinned CPU engine for compatibility check
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from types import SimpleNamespace

          sys.path.insert(0, str(Path.cwd()))
          from app.ai.binary_manager import BinaryManager, ENGINE_RELEASE

          manager = BinaryManager(Path("build/engine-check"), SimpleNamespace(backend="cpu"))
          metadata = subprocess.check_output([
              "gh", "api", f"repos/ggml-org/llama.cpp/releases/tags/{ENGINE_RELEASE}"
          ])
          # The CPU build the app installs on x64 Windows and Linux runners.
          name = (f"llama-{ENGINE_RELEASE}-bin-win-cpu-x64.zip" if sys.platform == "win32"
                  else f"llama-{ENGINE_RELEASE}-bin-ubuntu-x64.tar.gz")
          asset = next(asset for asset in json.loads(metadata)["assets"] if asset["name"] == name)
          manager.bin_dir.mkdir(parents=True, exist_ok=True)
          manager._install(asset, "cpu", None, lambda: False, lambda message: None)
          binary = manager.cpu_binary_path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"QUICKFILES_CPU_ENGINE={binary.resolve()}\n")

      - name: Check packaged application and external engine
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          executable = Path("QuickFiles") / ("QuickFiles.exe" if os.name == "nt" else "QuickFiles")
          environment = dict(os.environ, QT_QPA_PLATFORM="offscreen")
          process = subprocess.run([str(executable.resolve()), "--check", "packaged-check.json",
                                    os.environ["QUICKFILES_CPU_ENGINE"]],
                                   env=environment, timeout=120)
          report = json.loads(Path("packaged-check.json").read_text(encoding="utf-8"))
          print(json.dumps(report, indent=2))
          assert process.returncode == 0 and report["passed"], report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}
          path: packaged-check.json
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: QuickFiles-*
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY"
          --title "QuickFiles $GITHUB_REF_NAME"
          --generate-notes
          --draft
