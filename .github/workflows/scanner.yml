name: Native scanner

on:
  push:
    paths:
      - 'app/core/**'
      - 'app/constants.py'
      - 'app/config.py'
      - 'app/platforms.py'
      - 'app/main.py'
      - 'app/ai/**'
      - 'tools/build_scanner.py'
      - 'tests/**'
      - '.github/workflows/scanner.yml'
  pull_request:
    paths:
      - 'app/core/**'
      - 'app/constants.py'
      - 'app/config.py'
      - 'app/platforms.py'
      - 'app/main.py'
      - 'app/ai/**'
      - 'tools/build_scanner.py'
      - 'tests/**'
      - '.github/workflows/scanner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: fastscan-linux-x64
            archive: fastscan-linux-x64.tar.gz
          - os: windows-latest
            artifact: fastscan-windows-x64
            archive: fastscan-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select MinGW POSIX compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Build scanner
        run: python -B tools/build_scanner.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test scanner and planning integration
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Run native scan benchmark
        run: python -B tests/benchmark_scan.py . --threads 4 --repeat 2
      - name: Package Linux executable with permissions
        if: runner.os == 'Linux'
        run: tar -czf fastscan-linux-x64.tar.gz -C app/core/native/bin fastscan
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path app/core/native/bin/fastscan.exe -DestinationPath fastscan-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
